name: OrangeFox - Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: 🦊 Building OrangeFox Recovery
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    permissions: write-all
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: OrangeFox Build
      uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
      with:
        USER_NAME: 'nayem8854'
        USER_EMAIL: 'znayem830@gmail.com'
        DEVICE_TREE: 'https://github.com/nayem8854/twrp_device_realme_RMX1931.git'
        DEVICE_TREE_BRANCH: 'twrp-12.1L'
        DEVICE_PATH: 'device/realme/samurai'
        DEVICE_NAME: 'samurai'
        BUILD_TARGET: 'recovery'
        MAINTAINER_URL: 'https://i.ibb.co.com/8gyjXq06/maintainer.png'
        GH_RELEASE: 'true'
