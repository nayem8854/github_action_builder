name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel source repository (owner/repo or repo URL)'
        required: true
      source_branch:
        description: 'Source branch name'
        required: true
        default: 'main'
      build_script:
        description: 'Build script filename'
        required: true
        default: 'build_ksun_susfs.sh'
      build_script_link:
        description: 'Direct URL to download the build script into the workspace'
        required: false
        default: ''
      workspace_folder_name:
        description: 'Workspace folder name for checkout and build'
        required: true
        default: 'kernel_build_workspace'
      kernel_zip_name:
        description: 'Kernel zip file name to include in the release'
        required: true
        default: 'kernel.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set workflow inputs
        run: |
          echo "KERNEL_SOURCE=${{ inputs.kernel_source }}" >> $GITHUB_ENV
          echo "SOURCE_BRANCH=${{ inputs.source_branch }}" >> $GITHUB_ENV
          echo "BUILD_SCRIPT=${{ inputs.build_script }}" >> $GITHUB_ENV
          echo "BUILD_SCRIPT_LINK=${{ inputs.build_script_link }}" >> $GITHUB_ENV
          echo "WORKSPACE_FOLDER_NAME=${{ inputs.workspace_folder_name }}" >> $GITHUB_ENV
          echo "KERNEL_ZIP_NAME=${{ inputs.kernel_zip_name }}" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          mkdir -p "${WORKSPACE_FOLDER_NAME}"
          if [[ "${KERNEL_SOURCE}" == https://* || "${KERNEL_SOURCE}" == http://* ]]; then
            REPO_URL="${KERNEL_SOURCE}"
          else
            REPO_URL="https://github.com/${KERNEL_SOURCE}.git"
          fi
          git clone --depth 1 --branch "${SOURCE_BRANCH}" "${REPO_URL}" "${WORKSPACE_FOLDER_NAME}"

      - name: Download build script
        if: ${{ inputs.build_script_link != '' }}
        run: |
          mkdir -p "${WORKSPACE_FOLDER_NAME}"
          curl -L "${{ inputs.build_script_link }}" -o "${WORKSPACE_FOLDER_NAME}/${BUILD_SCRIPT}"

      - name: Set timezone
        run: |
          sudo timedatectl set-timezone Asia/Dhaka

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc git-core gnupg flex bison build-essential \
            zip curl wget zlib1g-dev libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            libssl-dev ccache cpio

      - name: Make script executable
        run: |
          chmod +x "${WORKSPACE_FOLDER_NAME}/${BUILD_SCRIPT}"
          sed -i 's/\r$//' "${WORKSPACE_FOLDER_NAME}/${BUILD_SCRIPT}"

      - name: Build Kernel
        run: |
          cd "${WORKSPACE_FOLDER_NAME}"
          ./"${BUILD_SCRIPT}"

      - name: Prepare Release Artifacts
        id: artifacts
        run: |
          RELEASE_FILES=""

          ZIP_FILE=$(find "${WORKSPACE_FOLDER_NAME}" -type f -name "*.zip" | head -n 1)
          if [[ -n "$ZIP_FILE" ]]; then
            RELEASE_FILES="$ZIP_FILE"
          fi

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Kernel Build ${{ steps.tag.outputs.tag }}
          files: ${{ steps.artifacts.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
