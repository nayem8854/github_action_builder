name: Build Android Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/nayem8854/android_kernel_realme_sm8150_qpr2.git
  KERNEL_BRANCH: official-polish-23.2

  #CLANG_REPO: https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git
  CLANG_REPO: https://github.com/realahnet/clang-r563880c.git

  ANYKERNEL_REPO: https://github.com/zahid5656/AnyKernel3.git
  ANYKERNEL_BRANCH: main

  DEFCONFIG: samurai_defconfig

  ARCH: arm64
  SUBARCH: arm64

  KBUILD_BUILD_USER: build-user
  KBUILD_BUILD_HOST: nayem
  KBUILD_BUILD_VERSION: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}
          restore-keys: |
            ccache-

      - name: Clone Kernel Source
        run: |
          git clone \
            --depth=1 \
            -b $KERNEL_BRANCH \
            $KERNEL_REPO \
            kernel

      - name: Clone Clang
        run: |
          git clone \
            --depth=1 \
            $CLANG_REPO \
            toolchains/clang

      - name: Show Compiler
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH
          clang --version

      - name: Build Kernel
        run: |

          cd kernel

          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf

          mkdir out

          make O=out $DEFCONFIG

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee ../build.log

      - name: Clone AnyKernel3
        run: |
          git clone \
            --depth=1 \
            -b $ANYKERNEL_BRANCH \
            $ANYKERNEL_REPO \
            AnyKernel3

      - name: Package Kernel
        run: |

          IMAGE=""

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
              IMAGE=kernel/out/arch/arm64/boot/Image.gz-dtb
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
              IMAGE=kernel/out/arch/arm64/boot/Image.gz
          else
              IMAGE=kernel/out/arch/arm64/boot/Image
          fi

          cp "$IMAGE" AnyKernel3/

          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
              cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          cd AnyKernel3

          ZIP_NAME=samurai-3.14.357-$(date +%Y%m%d-%H%M).zip

          zip -r9 ../$ZIP_NAME .

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel
          path: ${{ env.ZIP_NAME }}

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log

      - name: ccache Stats
        run: ccache -s

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: Android Kernel Build #${{ github.run_number }}
          files: ${{ env.ZIP_NAME }}
